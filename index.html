<!DOCTYPE html>
<html lang="fr" class="no-js">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>André Devesa — Video Editor</title>
  <meta name="description" content="André Devesa, monteur vidéo freelance : reels, vidéos YouTube et contenus de marque." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="André Devesa — Video Editor" />
  <meta property="og:description" content="Monteur vidéo freelance : reels, vidéos YouTube et contenus de marque." />
  <meta property="og:type" content="website" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Almendra:ital,wght@0,400;0,700;1,400&family=Hammersmith+One&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="assets/svg/AndreDevesa.svg" />
  <link rel="stylesheet" href="public/v2/styles.css" />
  <script>document.documentElement.className = 'js';</script>
</head>
<body data-scene="intro">

  <!-- ═════════ HUD (toujours au-dessus des scènes) ═════════ -->
  <header class="hud">
    <a class="hud-logo" id="hudLogo" href="#main" aria-label="André Devesa — retour au menu">
      <img src="assets/svg/AndreDevesa.svg" alt="" width="1718" height="470" draggable="false" />
    </a>
    <p class="hud-label" id="hudLabel" aria-live="polite"></p>
  </header>

  <a class="back" id="back" href="#main">
    <span class="back-in"><i aria-hidden="true"></i>Retour <kbd>Esc</kbd></span>
  </a>

  <main>

    <!-- ═════════ INTRO ═════════ -->
    <section class="scene scene--intro" id="scene-intro" aria-label="Introduction" tabindex="-1">
      <div class="rig"><div class="cam">
        <div class="layer intro-city"><img src="assets/img/mtp.webp" alt="" draggable="false" /></div>
        <div class="layer intro-clouds"><img src="assets/svg/CLOUDS.svg" alt="" draggable="false" /></div>
        <div class="layer intro-center">
          <h1 class="intro-logo"><img src="assets/svg/AndreDevesa.svg" alt="André Devesa" width="1718" height="470" draggable="false" /></h1>
          <p class="intro-tag"><span>Monteur vidéo freelance</span></p>
        </div>
        <div class="layer intro-prompt">
          <button class="intro-start" id="introStart" type="button">
            <img src="assets/svg/ClickAnywhere.svg" alt="Entrer — cliquer n'importe où" width="1390" height="258" draggable="false" />
          </button>
        </div>
      </div></div>
    </section>

    <!-- ═════════ MENU PRINCIPAL ═════════ -->
    <section class="scene scene--main" id="scene-main" aria-label="Menu principal" tabindex="-1" inert>
      <div class="rig"><div class="cam">
        <div class="layer shard shard--m1"><i></i></div>
        <div class="layer shard shard--m2"><i></i></div>
        <div class="layer shard shard--m3"><i></i></div>
        <div class="layer shard shard--m4"><i></i></div>
        <div class="layer beam" id="beam" aria-hidden="true"><div class="beam-in"><i></i><i></i></div></div>
        <div class="layer char char--main"><img src="assets/svg/Visu1.svg" alt="" width="3320" height="2146" draggable="false" decoding="async" /></div>
        <div class="layer shard shard--m5"><i></i></div>

        <nav class="layer menu" id="menu" aria-label="Navigation principale">
          <a class="menu-item is-selected" href="#video">
            <img class="menu-box" src="assets/svg/Textbox.svg" alt="" draggable="false" />
            <img class="menu-word" src="assets/svg/VideoEditing.svg" alt="Video Editing" draggable="false" />
            <span class="menu-sub" id="subVideo">Reels · YouTube</span>
          </a>
          <a class="menu-item" href="#contact">
            <img class="menu-box" src="assets/svg/Textbox.svg" alt="" draggable="false" />
            <img class="menu-word" src="assets/svg/Contact.svg" alt="Contact" draggable="false" />
            <span class="menu-sub">hello@andredevesa.com</span>
          </a>
        </nav>
      </div></div>
    </section>

    <!-- ═════════ VIDEO EDITING ═════════ -->
    <section class="scene scene--video" id="scene-video" aria-label="Video Editing" tabindex="-1" inert>
      <div class="rig"><div class="cam">
        <div class="layer shard shard--v1"><i></i></div>
        <div class="layer shard shard--v2"><i></i></div>
        <div class="layer shard shard--v3"><i></i></div>
        <div class="layer char char--video"><img src="assets/svg/Visu2.svg" alt="" width="3052" height="2114" draggable="false" decoding="async" /></div>

        <div class="layer panel panel--video">
          <div class="panel-tilt">
            <div class="tabs" role="tablist" aria-label="Format">
              <button class="tab tab--reels" id="tab-reels" type="button" role="tab" aria-selected="true" aria-controls="rows" data-tab="reels">
                <img src="assets/svg/Reels.svg" alt="Reels" draggable="false" />
              </button>
              <button class="tab tab--youtube" id="tab-youtube" type="button" role="tab" aria-selected="false" aria-controls="rows" data-tab="youtube" tabindex="-1">
                <img src="assets/svg/YouTube.svg" alt="YouTube" draggable="false" />
              </button>
            </div>
            <div class="box" id="videoBox">
              <div class="chips" id="chips" role="group" aria-label="Filtrer par client"></div>
              <ol class="rows" id="rows" role="tabpanel" aria-labelledby="tab-reels" tabindex="-1"></ol>
            </div>
          </div>
        </div>
      </div></div>
    </section>

    <!-- ═════════ CONTACT ═════════ -->
    <section class="scene scene--contact" id="scene-contact" aria-label="Contact" tabindex="-1" inert>
      <div class="rig"><div class="cam">
        <div class="layer shard shard--c1"><i></i></div>
        <div class="layer shard shard--c2"><i></i></div>
        <div class="layer shard shard--c3"><i></i></div>
        <div class="layer char char--contact"><img src="assets/svg/Visu3.svg" alt="" width="2705" height="2057" draggable="false" decoding="async" /></div>

        <div class="layer panel panel--contact">
          <div class="panel-tilt">
            <div class="mail-wrap">
              <a class="mail" id="mail" href="mailto:hello@andredevesa.com">hello@andredevesa.com</a>
              <button class="copy" id="copyMail" type="button"><span>Copier l'adresse</span></button>
            </div>
            <div class="box">
              <p class="kicker"><i aria-hidden="true"></i>good news only</p>
              <form class="form" id="contactForm">
                <div class="field">
                  <label for="f-name">Name</label>
                  <input id="f-name" name="name" type="text" autocomplete="name" placeholder="Ahmed Iter" required />
                </div>
                <div class="field">
                  <label for="f-email">Email</label>
                  <input id="f-email" name="email" type="email" autocomplete="email" placeholder="your@email.com" required />
                </div>
                <div class="field">
                  <label for="f-msg">Message</label>
                  <textarea id="f-msg" name="message" rows="4" placeholder="Bla bla bla..." required></textarea>
                </div>
                <button class="send" type="submit"><span>Envoyer</span></button>
              </form>
            </div>
          </div>
        </div>
      </div></div>
    </section>

  </main>

  <!-- Volet de transition (3 lames + étoile) -->
  <div class="wipe" id="wipe" aria-hidden="true">
    <i></i><i></i><i></i>
    <img class="wipe-star" src="assets/svg/etoile.svg" alt="" />
  </div>

  <div class="ticker" aria-hidden="true">
    <div class="ticker-track" id="tickerTrack"><span>André Devesa @2026. ATLUS PLEASE DON'T SUE ME</span></div>
  </div>

  <div class="cursor" id="cursor" aria-hidden="true"></div>

  <noscript>
    <div class="noscript">
      <img src="assets/svg/AndreDevesa.svg" alt="André Devesa" />
      <p>Monteur vidéo freelance. Ce site a besoin de JavaScript pour s'animer —
      en attendant : <a href="mailto:hello@andredevesa.com">hello@andredevesa.com</a></p>
    </div>
  </noscript>

  <script src="public/v2/projects.js" defer></script>
  <script src="public/v2/app.js" defer></script>
</body>
</html>
